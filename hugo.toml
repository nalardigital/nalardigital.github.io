baseURL = 'https://nalardigital.github.io/'
locale = 'id-ID'
title = 'Nalar Digital'
theme = 'PaperMod'

paginate = 8
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = 'production'
  title = 'Nalar Digital'
  description = 'Blog tentang teknologi dan pemanfaatan AI untuk kehidupan manusia.'
  keywords = ['AI', 'teknologi', 'kecerdasan buatan', 'blog teknologi indonesia']
  author = 'nalardigital'
  DateFormat = '2 January 2006'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = 'Nalar di Balik Teknologi \U0001F9E0'
    Content = 'Blog seputar teknologi dan bagaimana kecerdasan buatan (AI) dimanfaatkan untuk membantu kehidupan manusia sehari-hari — ditulis untuk pembaca umum, bukan hanya praktisi.'

  [params.label]
    text = 'Nalar Digital'
    iconSVG = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="9" fill="url(#nd-grad)"/><defs><linearGradient id="nd-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#4338CA"/></linearGradient></defs><text x="16" y="22" font-family="'Sora',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">N</text></svg>'''

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/nalardigital'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Artikel'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'about'
    name = 'Tentang'
    url = '/about/'
    weight = 20
  [[menu.main]]
    identifier = 'privacy'
    name = 'Kebijakan Privasi'
    url = '/privacy-policy/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = 'Cari'
    url = '/search/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.highlight]
    noClasses = false
